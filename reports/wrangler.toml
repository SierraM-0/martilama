name = "martilama-reports"
main = "src/index.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "reports.martilama.com", custom_domain = true }]

[assets]
directory = "./public"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "martilama-reports"

[[ratelimits]]
name = "INGEST_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
ALLOWED_ORIGINS = "https://martilama.com"
# The "Reports viewer" Access application's team domain and audience tag.
# Neither is a secret. If either is empty the viewer answers 403 to everyone.
ACCESS_TEAM_DOMAIN = "martilama.cloudflareaccess.com"
ACCESS_AUD = "e0f635d26a84d8ebb6b89dce5d0074920eb2f22f28221a82209145ec254fcf3e"

# Local `wrangler dev` only: without this the Worker sees requests as coming
# to the route's hostname, and the localhost-only Access bypass never applies.
[dev]
host = "localhost:8787"
upstream_protocol = "http"
